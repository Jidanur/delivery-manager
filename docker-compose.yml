services:
  postgres_db:
    image: postgres:latest
    restart: always
    container_name: deliver-manager-postgres_db
    user: "999:999"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - pg-network
    volumes:
      # Mount the init SQL file to the /docker-entrypoint-initdb.d directory
      - ./server/db/init/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql

networks:
  pg-network:
